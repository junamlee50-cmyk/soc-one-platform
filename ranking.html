<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOC Ranking</title><style>
:root{--bg:#070a0f;--panel:#111824;--line:#2b3547;--gold:#e6c36a;--muted:#aab3c0;--text:#f5f1e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2432,#070a0f 42%);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{font-size:27px;font-weight:900;color:var(--gold)}.btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#121a26}.gold{background:var(--gold);color:#111;font-weight:800}.hero{padding:35px 0}.hero h1{font-size:46px;margin:8px 0}.hero p,p{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#111824;border:1px solid var(--line);border-radius:18px;padding:20px}.card h3{margin:8px 0}.tag{font-size:11px;color:var(--gold);font-weight:800}.table{width:100%;border-collapse:collapse;background:#0d131c;border:1px solid var(--line)}.table th,.table td{padding:14px;border-bottom:1px solid var(--line);text-align:left}.table th{color:#9ea9b7;font-size:12px}.rank{color:var(--gold);font-weight:900}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filters button{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#111824;color:#fff}.filters .on{background:var(--gold);color:#111}.search{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d131c;color:#fff;margin:12px 0 20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}.top{align-items:flex-start;gap:10px;flex-direction:column}.table{min-width:680px}.scroll{overflow:auto}}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="/">SOC</a><div><a class="btn" href="/competition.html">대회</a> <a class="btn gold" href="/my-soc.html">MY SOC</a></div></div><div class="hero"><div class="tag">OFFICIAL RANKING</div><h1>경기순위와 후원선발은 분리합니다.</h1><p>랭킹은 경기성과를 보여주는 스포츠 지표입니다. 선수지원은 별도 예산·정원·100점 평가를 통해 선발합니다.</p></div><div class="filters"><button class="on">전체</button><button>GI</button><button>NO-GI</button><button>남성</button><button>여성</button><button>아카데미</button></div><div class="scroll"><table class="table"><thead><tr><th>순위</th><th>선수</th><th>아카데미</th><th>벨트</th><th>체급</th><th>포인트</th></tr></thead><tbody id="rows"></tbody></table></div><p style="font-size:11px">※ 현재는 DEMO 데이터입니다.</p></div><script>fetch('/api/ranking').then(r=>r.json()).then(d=>{rows.innerHTML=d.ranking.map(x=>`<tr><td class="rank">#${x.rank}</td><td><b>${x.name}</b></td><td>${x.academy}</td><td>${x.belt}</td><td>${x.weight}</td><td>${x.points}</td></tr>`).join('')})</script></body></html>
