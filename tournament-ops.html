<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tournament Ops | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>TOURNAMENT OPS</span></span></a><span class="appBadge">LIVE OPS</span></div><div class="roleHero"><div class="kicker">TOURNAMENT OPERATIONS</div><h1>체크인 → 계체 → 대진 → 결과</h1><p class="lead">대회 당일 현장에서 실제 데이터를 처리하는 운영 콘솔입니다.</p></div><div class="panel"><div class="formGrid"><div class="field full"><label>운영 대회</label><select id="opTournament"></select></div></div><div class="quickActions"><button class="btn gold" onclick="refreshAll()">새로고침</button><button class="btn" onclick="startScanner()">QR 카메라</button></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="num">QR CHECK-IN</div><h3>참가증 체크인</h3><video id="scanVideo" autoplay playsinline style="width:100%;max-height:260px;border-radius:14px;background:#000;display:none"></video><div class="formGrid"><div class="field full"><label>QR 문자열 직접입력/스캔값</label><input id="qrPayload" placeholder="SOC:reg_xxx:signature"></div></div><div class="quickActions"><button class="btn gold" onclick="checkIn()">체크인 처리</button><button class="btn" onclick="stopScanner()">카메라 종료</button></div><p id="checkMsg" class="small"></p></div><div class="panel"><div class="num">WEIGH-IN</div><h3>계체 처리</h3><div class="formGrid"><div class="field full"><label>참가신청</label><select id="weighReg"></select></div><div class="field"><label>실측 kg</label><input id="weighKg" type="number" step="0.1"></div><div class="field"><label>체급상한 kg</label><input id="weighLimit" type="number" step="0.1"></div></div><div class="quickActions"><button class="btn gold" onclick="weighIn()">계체 저장</button></div><p id="weighMsg" class="small"></p></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="num">BRACKET</div><h3>대진 생성</h3><div class="formGrid"><div class="field full"><label>Division Key</label><select id="bracketDivision"></select></div></div><div class="quickActions"><button class="btn gold" onclick="createBracket()">대진 생성</button></div><p class="small">결제완료 + 계체통과 선수만 대진에 들어갑니다.</p><pre id="bracketMsg" class="small"></pre></div><div class="panel"><div class="num">MATCH RESULT</div><h3>경기 결과 입력</h3><div class="formGrid"><div class="field full"><label>경기</label><select id="matchSelect"></select></div><div class="field full"><label>승자</label><select id="winnerSelect"></select></div><div class="field"><label>승리방법</label><select id="winMethod"><option>POINTS</option><option>SUBMISSION</option><option>REFEREE_DECISION</option><option>DQ</option></select></div><div class="field"><label>메달(해당 시)</label><select id="medal"><option value="">없음</option><option>GOLD</option><option>SILVER</option><option>BRONZE</option><option>ABS_GOLD</option><option>ABS_SILVER</option><option>ABS_BRONZE</option></select></div></div><div class="quickActions"><button class="btn gold" onclick="saveResult()">결과 저장</button></div><p id="resultMsg" class="small"></p></div></div><div class="panel" style="margin-top:14px"><div class="num">REGISTRATIONS</div><h3>현장 참가자</h3><div id="opsRegs" class="dataList"></div></div><div class="panel" style="margin-top:14px"><div class="num">MATCHES</div><h3>대진·경기 현황</h3><div id="opsMatches" class="dataList"></div></div></main><div class="bottomNav"><div class="inner"><a href="/admin.html"><b>⚙</b>관리자</a><a href="/tournament-ops.html"><b>◫</b>운영</a><a href="/competition.html"><b>◎</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/my-soc.html"><b>⌂</b>MY SOC</a></div></div><script src="/assets/soc.js"></script><script>
let regs=[],matches=[],stream=null,scanTimer=null;
async function api(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return await r.json()}
async function boot(){const u=await SOC.requireRoles(['REFEREE','STAFF','ADMIN','CEO']);if(!u)return;const t=await api('/api/operations/tournaments');opTournament.innerHTML=(t.tournaments||[]).map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');opTournament.addEventListener('change',refreshAll);await refreshAll()}
async function refreshAll(){if(!opTournament.value)return;const [r,m,d]=await Promise.all([api('/api/operations/registrations?tournamentId='+encodeURIComponent(opTournament.value)),api('/api/operations/matches?tournamentId='+encodeURIComponent(opTournament.value)),api('/api/divisions/index?tournamentId='+encodeURIComponent(opTournament.value))]);regs=r.registrations||[];matches=m.matches||[];renderRegs();renderMatches();bracketDivision.innerHTML=(d.divisions||[]).map(x=>'<option value="'+x.key+'">'+x.discipline+' · '+x.ageGroup+' · '+x.belt+' · '+x.weightClass+(x.absolute?' ABS':'')+'</option>').join('')}
function renderRegs(){weighReg.innerHTML=regs.map(x=>'<option value="'+x.id+'">'+x.athleteName+' · '+x.weightClass+' · '+x.paymentStatus+'</option>').join('');opsRegs.innerHTML=regs.length?regs.map(x=>'<div class="dataRow"><span>'+x.athleteName+' · '+x.discipline+' '+x.weightClass+'<br><small>'+x.paymentStatus+' · '+(x.checkInStatus||'NOT_CHECKED_IN')+'</small></span><b>'+(x.weighInStatus||'NOT_WEIGHED')+'</b></div>').join(''):'<div>참가자 없음</div>'}
function renderMatches(){matchSelect.innerHTML=matches.filter(x=>x.status!=='COMPLETED'&&x.athleteA&&x.athleteB).map(x=>'<option value="'+x.id+'">R'+x.roundNo+' #'+x.sequenceNo+' · '+x.athleteA.name+' vs '+x.athleteB.name+'</option>').join('');opsMatches.innerHTML=matches.length?matches.map(x=>'<div class="dataRow"><span>R'+x.roundNo+' #'+x.sequenceNo+' · '+(x.athleteA?.name||'TBD')+' vs '+(x.athleteB?.name||'TBD')+'</span><b>'+x.status+'</b></div>').join(''):'<div>대진 없음</div>';updateWinner()}
matchSelect.addEventListener('change',updateWinner);function updateWinner(){const m=matches.find(x=>x.id===matchSelect.value);winnerSelect.innerHTML=m?[m.athleteA,m.athleteB].filter(Boolean).map(x=>'<option value="'+x.userId+'">'+x.name+'</option>').join(''):''}
async function checkIn(){const d=await api('/api/operations/checkin',{method:'POST',body:JSON.stringify({payload:qrPayload.value})});checkMsg.textContent=d.ok?'체크인 완료: '+d.registration.athleteName:'실패: '+(d.error||'');if(d.ok)refreshAll()}
async function weighIn(){const d=await api('/api/operations/weighin',{method:'POST',body:JSON.stringify({registrationId:weighReg.value,weightKg:weighKg.value,limitKg:weighLimit.value})});weighMsg.textContent=d.ok?(d.weighIn.passed?'계체 통과':'계체 실패'):'실패: '+(d.error||'');if(d.ok)refreshAll()}
async function createBracket(){const d=await api('/api/operations/bracket',{method:'POST',body:JSON.stringify({tournamentId:opTournament.value,divisionKey:bracketDivision.value})});bracketMsg.textContent=d.ok?'대진 생성 완료 · '+d.matches.length+'경기':'실패: '+(d.error||'');if(d.ok)refreshAll()}
async function saveResult(){const d=await api('/api/operations/result',{method:'POST',body:JSON.stringify({matchId:matchSelect.value,winnerUserId:winnerSelect.value,winMethod:winMethod.value,medal:medal.value})});resultMsg.textContent=d.ok?'결과 저장 완료':'실패: '+(d.error||'');if(d.ok)refreshAll()}
async function startScanner(){if(!('BarcodeDetector' in window)){checkMsg.textContent='이 브라우저는 카메라 QR 자동인식을 지원하지 않습니다. QR 문자열을 직접 입력하세요.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});scanVideo.srcObject=stream;scanVideo.style.display='block';const detector=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const codes=await detector.detect(scanVideo);if(codes.length){qrPayload.value=codes[0].rawValue;checkMsg.textContent='QR 인식 완료';stopScanner()}}catch{}},400)}catch(e){checkMsg.textContent='카메라 권한을 허용해 주세요.'}}
function stopScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}scanVideo.style.display='none'}
boot();
</script></body></html>
