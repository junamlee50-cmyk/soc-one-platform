<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 보안 | SOC ONE</title><link rel="stylesheet" href="/assets/soc.css"><style>.panel{margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><main class="appShell"><a class="btn" href="/my-soc.html">MY SOC</a><h1>계정 보안</h1><p id="securityMsg" role="status" aria-live="polite"></p><section class="panel"><h2>인증 앱 추가인증</h2><p id="mfaStatus"></p><form id="mfaStartForm"><label for="mfaPassword">현재 비밀번호</label><input id="mfaPassword" type="password" autocomplete="current-password" required><button class="btn gold">추가인증 등록 시작</button></form><section id="mfaEnrollment" hidden><p>본인 인증 앱으로 QR을 등록한 뒤 6자리 코드를 입력하세요. 아래 키와 복구코드는 다른 사람에게 전달하지 마세요.</p><img id="mfaQr" alt="인증 앱 등록 QR" width="240" height="240"><pre id="mfaSecret"></pre><form id="mfaConfirmForm"><label for="mfaCode">인증 앱 코드</label><input id="mfaCode" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><button class="btn gold">추가인증 등록 완료</button></form></section><pre id="recoveryCodes"></pre></section><section class="panel"><h2>비밀번호 변경</h2><p>변경하면 다른 기기의 로그인은 해제됩니다.</p><form id="passwordForm"><label for="currentPassword">현재 비밀번호</label><input id="currentPassword" type="password" autocomplete="current-password" required><label for="newPassword">새 비밀번호 (12자 이상)</label><input id="newPassword" type="password" minlength="12" maxlength="256" autocomplete="new-password" required><label for="passwordOtp">추가인증 코드 (등록한 경우)</label><input id="passwordOtp" inputmode="numeric" autocomplete="one-time-code"><button class="btn gold">비밀번호 변경</button></form></section><section class="panel"><h2>모든 기기 로그아웃</h2><button class="btn" id="logoutAll">현재 기기를 포함해 모두 로그아웃</button></section></main><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script src="/assets/security.js"></script></body></html>
