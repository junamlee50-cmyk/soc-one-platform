<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY SOC</title><style>body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:50px auto;padding:20px}.card{background:#111824;border:1px solid #2c3749;border-radius:18px;padding:22px;margin:12px 0}a{color:#e6c36a}button,input,select{padding:11px;border-radius:10px;border:1px solid #394459;background:#0b1017;color:#fff;margin:5px}.gold{background:#e6c36a;color:#111;border:0;font-weight:700}</style></head><body><div class="wrap"><a href="/">← SOC ONE</a><h1>MY SOC</h1><div class="card"><h3>1. SOC ID 발급 데모</h3><input id="name" placeholder="이름"><input id="email" placeholder="이메일"><select id="role"><option>ATHLETE</option><option>COACH</option></select><button class="gold" onclick="join()">SOC ID 발급</button><pre id="joinOut"></pre></div><div class="card"><h3>2. 대시보드 데모</h3><select id="dashRole"><option>athlete</option><option>academy</option><option>region</option><option>referee</option><option>ceo</option></select><button class="gold" onclick="dash()">불러오기</button><pre id="dashOut"></pre></div></div><script>
async function join(){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,role:role.value})});joinOut.textContent=JSON.stringify(await r.json(),null,2)}
async function dash(){const r=await fetch('/api/dashboard?role='+dashRole.value);dashOut.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
