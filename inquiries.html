<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의하기 | SOC</title><link rel="stylesheet" href="/assets/soc.css"><link rel="stylesheet" href="/assets/brand-refresh.css"></head><body><main class="container" style="padding-top:32px"><a class="btn" href="/">SOC 홈</a><h1 id="inquiryHeading">문의하기</h1><p id="contactInformation"></p><p>대회 신청, 입금 확인, 환불, 경기 결과에 관해 문의할 수 있습니다. 비밀번호·주민등록번호·계좌 비밀번호는 입력하지 마세요. 경기 판정 이의신청은 해당 대회의 기한과 절차를 따릅니다.</p><p id="inquiryMessage" role="status"></p><section id="inquiryGuest" hidden><a class="btn gold" href="/my-soc.html">로그인 후 문의하기</a></section><form id="inquiryForm" class="panel" hidden><div class="formGrid"><div class="field"><label for="inquiryCategory">문의 유형</label><select id="inquiryCategory"><option value="ACCOUNT">회원·계정</option><option value="REGISTRATION">대회 신청</option><option value="PAYMENT">입금 확인</option><option value="REFUND">취소·환불</option><option value="RESULT">경기 결과</option><option value="SUPPORT">선수지원</option><option value="OTHER">기타</option></select></div><div class="field"><label for="inquiryRegistration">관련 신청번호 (선택)</label><input id="inquiryRegistration" maxlength="80"></div><div class="field full"><label for="inquirySubject">제목</label><input id="inquirySubject" maxlength="160" required></div><div class="field full"><label for="inquiryBody">내용</label><textarea id="inquiryBody" rows="7" maxlength="4000" minlength="5" required></textarea></div></div><button class="btn gold" type="submit">문의 접수</button></form><section><div class="quickActions"><h2 id="inquiryListTitle">내 문의 내역</h2><button class="btn" id="inquiryReload" type="button">새로고침</button></div><div id="inquiryList" class="dataList"></div></section></main><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script src="/assets/inquiries.js"></script></body></html>
