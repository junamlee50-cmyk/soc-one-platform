<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEO APP | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>EXECUTIVE</span></span></a><span class="appBadge">CEO</span></div><div class="roleHero"><div class="kicker">EXECUTIVE CONTROL</div><h1>대표이사 경영 대시보드</h1><p class="lead">회원·아카데미·대회·현금유입·스폰서·선수지원·운영감사 데이터를 실시간 집계합니다.</p></div><div class="kpiGrid" id="ceoKpis"></div><div class="quickActions"><a class="btn gold" href="/admin.html">관리자 콘솔</a><a class="btn" href="/tournament-ops.html">대회운영</a><a class="btn" href="/sponsors.html">스폰서</a><a class="btn" href="/support.html">선수지원</a><button class="btn" onclick="SOC.logout()">로그아웃</button></div><div class="grid2"><div class="panel"><div class="num">SPONSOR CRM</div><h3>스폰서 현황</h3><div id="sponsorData" class="dataList"></div></div><div class="panel"><div class="num">RISK CONTROL</div><h3>오픈 전 필수 확인</h3><div class="timeline"><div><b>법률</b><br><span class="small">법인정보·개인정보·미성년자 동의·선수계약 최종 확정</span></div><div><b>결제</b><br><span class="small">현재 수동 입금확인 운영 가능 · PG 계약 후 자동결제 연결</span></div><div><b>도메인</b><br><span class="small">최종 도메인 연결 후 robots·검색노출 전환</span></div></div></div></div></main><div class="bottomNav"><div class="inner"><a href="/ceo-app.html"><b>◎</b>CEO</a><a href="/competition.html"><b>◫</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/sponsors.html"><b>₩</b>사업</a><a href="/admin.html"><b>⚙</b>운영</a></div></div><script src="/assets/soc.js"></script><script>

async function boot(){const u=await SOC.requireRoles(['CEO']);if(!u)return;const [d,s]=await Promise.all([api('/api/admin/overview'),api('/api/admin/sponsors')]);ceoKpis.innerHTML=Object.entries(d.overview||{}).map(([k,v])=>'<div class="kpi"><strong>'+v+'</strong><small>'+k+'</small></div>').join('');const rows=s.sponsors||[];const contracted=rows.filter(x=>x.status==='CONTRACTED');const value=contracted.reduce((a,x)=>a+(Number(x.contractValue)||0),0),recv=rows.reduce((a,x)=>a+(Number(x.receivable)||0),0);sponsorData.innerHTML='<div class="dataRow"><span>전체 파이프라인</span><b>'+rows.length+'건</b></div><div class="dataRow"><span>계약완료</span><b>'+contracted.length+'건</b></div><div class="dataRow"><span>계약가치</span><b>'+SOC.money(value)+'</b></div><div class="dataRow"><span>미수금</span><b>'+SOC.money(recv)+'</b></div>'}boot();
</script></body></html>
