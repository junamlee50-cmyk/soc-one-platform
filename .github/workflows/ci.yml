name: SOC ONE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: soc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soc_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: soc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soc_test -d soc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified in preceding run
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate routes, browser scripts, and API behavior
        env:
          TEST_DATABASE_URL: postgresql://soc_test:isolated-ci-only@localhost:5432/soc_test
        run: npm run validate
