<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>심판 운영도 기록과 평가로</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ONE PLATFORM</span></span></a><span class="appBadge">REFEREE APP</span></div><div class="roleHero"><div class="kicker">REFEREE APP</div><h1>심판 운영도 기록과 평가로</h1><p class="lead">배정된 대회·매트·시간 범위에서 경기 호출과 결과를 처리합니다. 교육·평가·수당 정산은 준비 중입니다.</p></div>
<div class="kpiGrid" id="rfKpis"></div><div class="quickActions"><a class="btn gold" href="/tournament-ops.html">대회운영 화면</a><a class="btn" href="/rules.html">경기규정</a></div>
<div class="grid2"><div class="panel"><div class="num">ASSIGNMENT</div><h3>예정 배정</h3><div class="timeline" id="assignmentList"></div></div>
<div class="panel"><div class="num">QUALITY</div><h3>심판 이력</h3><div class="dataList" id="refData"></div></div></div>
<script src="/assets/soc.js"></script><script>(async()=>{const u=await SOC.requireRoles(['REFEREE']);if(!u)return;const [d,a]=await Promise.all([SOC.get('/api/dashboard?role=referee'),SOC.get('/api/referee/assignments')]);if(!d.ok||!a.ok){assignmentList.textContent=d.message||a.message||'배정 정보를 불러오지 못했습니다.';return}const labels={completedMatches:'처리 경기',scheduled:'배정 경기',assignments:'현재 유효한 배정',rating:'평가'};rfKpis.innerHTML=Object.entries(d.data||{}).map(([k,v])=>'<div class="kpi"><strong>'+SOC.escape(v)+'</strong><small>'+SOC.escape(labels[k]||k)+'</small></div>').join('');refData.textContent='권한은 배정 시작 시각부터 종료 시각까지 유효하며 취소된 배정은 사용할 수 없습니다.';assignmentList.replaceChildren();for(const x of a.assignments||[]){const row=document.createElement('div');row.textContent=x.tournamentId+' · 매트 '+x.matNo+' · '+(x.startsAt?new Date(x.startsAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'시간 재배정 필요')+' ~ '+(x.endsAt?new Date(x.endsAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'미설정')+' · '+({ASSIGNED:'배정',REVOKED:'취소'}[x.status]||x.status);assignmentList.append(row)}if(!a.assignments?.length)assignmentList.textContent='예정 배정이 없습니다.'})()</script></main><div class="bottomNav"><div class="inner"><a href="/my-soc.html"><b>◎</b>MY SOC</a><a href="/competition.html"><b>◫</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/academies.html"><b>⌂</b>도장</a><a href="/admin.html"><b>⚙</b>운영</a></div></div><script>SOC.requireRoles(["REFEREE"]);</script></body></html>
