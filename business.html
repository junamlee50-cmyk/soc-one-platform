<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신청·주문 관리 | SOC</title><link rel="stylesheet" href="/assets/soc.css"><link rel="stylesheet" href="/assets/business.css"><link rel="icon" href="/favicon.svg"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/">SOC</a><a class="btn" href="/my-soc.html">내 SOC</a></div><h1 id="businessTitle">신청·주문 관리</h1><p id="businessLead"></p><nav class="quickActions" id="businessNav" aria-label="사업 구분"></nav><div class="quickActions"><button id="businessReload" class="btn">새로고침</button><a id="businessMode" class="btn" hidden>관리 화면</a></div><p id="businessMessage" role="status" aria-live="polite"></p>
<section id="programEditor" class="panel" hidden><h2>상품·모집·훈련 등록</h2><p>입력한 금액과 조건은 공개 후 신청 당시 기록으로 보관됩니다. 지원·훈련·프로 모집은 다른 관리자의 검토 후 공개합니다.</p><form id="programForm"><input id="programId" type="hidden"><div class="formGrid" id="programFields"></div><div class="quickActions"><button type="submit" class="btn gold">작성 내용 저장</button><button type="button" id="newProgram" class="btn">새 항목 작성</button></div></form></section>
<section><h2 id="programHeading">신청 가능한 항목</h2><div id="programList" class="dataList"></div></section>
<section id="applyPanel" class="panel" hidden><h2 id="applyTitle">신청</h2><p id="applyTerms" class="prewrap"></p><form id="applyForm"><div class="formGrid"><div class="field" data-apply="product"><label for="applyQuantity">수량</label><input id="applyQuantity" type="number" min="1" max="100" value="1"></div><div class="field full" data-apply="product"><label for="applyDelivery">수령인·연락처·배송지</label><textarea id="applyDelivery" maxlength="1000"></textarea></div><div class="field full" data-apply="support pro"><label for="applyEvidence">경기 기록·영상 주소·신청 내용</label><textarea id="applyEvidence" maxlength="2000"></textarea></div></div><p id="applyPrice"></p><label><input type="checkbox" id="applyConsent" required> 금액과 이용·취소 조건을 확인하고 동의합니다.</label><div class="quickActions"><button class="btn gold" type="submit">신청·주문 확정</button><button type="button" id="closeApply" class="btn">닫기</button></div></form></section>
<section><h2 id="recordHeading">내 신청·주문 내역</h2><div class="field"><label for="businessSearch">제목·신청번호 검색</label><input id="businessSearch" type="search"></div><div id="recordList" class="dataList"></div></section>
<section id="recordPanel" class="panel" hidden><h2>신청 처리</h2><div id="recordDetail"></div><form id="recordForm"><div class="formGrid"><div class="field"><label for="recordAction">처리 종류</label><select id="recordAction"></select></div><div class="field"><label for="recordAmount">처리 금액 (원)</label><input id="recordAmount" type="number" min="0" step="1"></div><div class="field"><label for="recordDepositor">입금자명</label><input id="recordDepositor" maxlength="80"></div><div class="field"><label for="recordAt">실제 거래 일시 (한국시간)</label><input id="recordAt" type="text" data-soc-date="datetime"></div><div class="field"><label for="recordReference">은행 거래 증빙 관리번호</label><input id="recordReference" maxlength="160"></div><div class="field"><label for="recordContract">계약·정책·수취인 확인 증빙 관리번호</label><input id="recordContract" maxlength="300"></div><div class="field"><label for="recordTracking">택배사·운송장 번호</label><input id="recordTracking" maxlength="200"></div><div class="field"><label for="recordRestock">반품 입고 확인</label><input id="recordRestock" type="checkbox"></div><div class="field full"><label for="recordReason">처리 사유·확인 근거</label><textarea id="recordReason" maxlength="500" required></textarea></div></div><p>입금·지급·환불은 실제 거래를 확인한 후 기록합니다. 이 화면에서 은행 송금을 실행하지 않습니다.</p><button type="submit" class="btn gold">처리 내용 저장</button></form></section>
<section id="businessLedger" class="panel" hidden><h2>수납·지급 장부</h2><p id="ledgerSummary"></p><div id="ledgerList" class="dataList"></div></section></main><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script src="/assets/business.js"></script></body></html>
