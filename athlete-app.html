<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Athlete APP | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ATHLETE APP</span></span></a><span class="appBadge">ATHLETE</span></div><div class="roleHero"><div class="kicker">ATHLETE APP</div><h1>선수의 모든 커리어를 한 화면에</h1><p class="lead">프로필·전적·랭킹·대회신청·QR 참가증·지원·훈련패스를 SOC ID 하나로 관리합니다.</p></div><div class="kpiGrid" id="athKpis"></div><div class="quickActions"><a class="btn gold" href="/competition.html">대회 신청</a><a class="btn" href="/ranking.html">랭킹</a><a class="btn" href="/support.html">선수지원</a><button class="btn" onclick="SOC.logout()">로그아웃</button></div><div class="appGrid"><aside class="appSide card"><a class="active" href="#profile">프로필</a><a href="#regs">대회신청</a><a href="#ticket">QR 참가증</a><a href="#career">커리어</a></aside><section class="appMain"><div class="grid2"><div class="panel" id="profile"><div class="num">PROFILE</div><h3>선수 프로필</h3><div class="formGrid"><div class="field"><label>공개 이름</label><input id="pName"></div><div class="field"><label>벨트</label><select id="pBelt"><option>WHITE</option><option>BLUE</option><option>PURPLE</option><option>BROWN</option><option>BLACK</option></select></div><div class="field"><label>기본 체중(kg)</label><input id="pWeight" type="number" step="0.1"></div><div class="field"><label>성별</label><select id="pGender"><option value="">미선택</option><option>MALE</option><option>FEMALE</option></select></div><div class="field full"><label>아카데미명</label><input id="pAcademy"></div><div class="field full"><label><input id="pPublic" type="checkbox" style="width:auto"> 공개 랭킹·선수 프로필에 표시 동의</label></div></div><div class="quickActions"><button class="btn gold" onclick="saveProfile()">프로필 저장</button></div><p class="small" id="profileMsg"></p></div><div class="panel" id="career"><div class="num">CAREER</div><h3>실제 경기 데이터</h3><div id="careerData" class="dataList"></div></div></div><div class="panel" id="regs" style="margin-top:14px"><div class="num">REGISTRATIONS</div><h3>대회 신청내역</h3><div id="regList" class="dataList"></div></div><div class="panel" id="ticket" style="margin-top:14px"><div class="num">EVENT TICKET</div><h3>QR 참가증</h3><p class="small">입금완료된 참가신청은 현장에서 QR 체크인에 사용합니다.</p><select id="ticketReg" class="search"></select><div class="quickActions"><button class="btn gold" onclick="showTicket()">QR 표시</button></div><div id="qrBox" style="display:grid;place-items:center;min-height:40px"></div><pre id="ticketText" class="small"></pre></div></section></div></main><div class="bottomNav"><div class="inner"><a href="/my-soc.html"><b>◎</b>MY SOC</a><a href="/competition.html"><b>◫</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/support.html"><b>+</b>지원</a><a href="/academies.html"><b>⌂</b>도장</a></div></div><script src="/assets/soc.js"></script><script>
let regs=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return await r.json()}
async function boot(){const u=await SOC.requireRoles(['ATHLETE']);if(!u)return;const [d,p,r]=await Promise.all([api('/api/dashboard?role=athlete'),api('/api/athlete'),api('/api/registrations/index')]);const x=d.data||{};athKpis.innerHTML=Object.entries(x).map(([k,v])=>'<div class="kpi"><strong>'+v+'</strong><small>'+k+'</small></div>').join('');if(p.athlete){pName.value=p.athlete.displayName||'';pBelt.value=p.athlete.belt||'WHITE';pWeight.value=p.athlete.defaultWeightKg||'';pGender.value=p.athlete.gender||'';pAcademy.value=p.athlete.academyName||'';pPublic.checked=!!p.athlete.publicProfile}regs=r.registrations||[];renderRegs();careerData.innerHTML='<div class="dataRow"><span>시즌 포인트</span><b>'+(x.points||0)+'</b></div><div class="dataRow"><span>승리</span><b>'+(x.wins||0)+'</b></div><div class="dataRow"><span>대회 신청</span><b>'+(x.registrations||0)+'</b></div><div class="dataRow"><span>결제완료</span><b>'+(x.paid||0)+'</b></div>'}
async function saveProfile(){const d=await api('/api/athlete',{method:'PUT',body:JSON.stringify({displayName:pName.value,belt:pBelt.value,defaultWeightKg:pWeight.value,gender:pGender.value,academyName:pAcademy.value,publicProfile:pPublic.checked})});profileMsg.textContent=d.ok?'저장 완료':'저장 실패: '+(d.error||'')}
function renderRegs(){regList.innerHTML=regs.length?regs.map(x=>'<div class="dataRow"><span>'+x.tournamentId+' · '+x.discipline+' '+x.weightClass+'</span><b>'+x.paymentStatus+' · '+(x.checkInStatus||'NOT_CHECKED_IN')+'</b></div>').join(''):'<div>신청내역이 없습니다.</div>';ticketReg.innerHTML=regs.map(x=>'<option value="'+x.id+'">'+x.tournamentId+' · '+x.discipline+' '+x.weightClass+'</option>').join('')}
async function showTicket(){if(!ticketReg.value)return;const d=await api('/api/ticket?registrationId='+encodeURIComponent(ticketReg.value));if(!d.ok){ticketText.textContent='참가증 오류: '+d.error;return}qrBox.innerHTML='<img alt="SOC QR Ticket" src="/api/ticket-qr?registrationId='+encodeURIComponent(ticketReg.value)+'" style="background:white;padding:12px;border-radius:18px;width:min(280px,80vw)">';ticketText.textContent=d.ticket.payload}
boot();
</script></body></html>
