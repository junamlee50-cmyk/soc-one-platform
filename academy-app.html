<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Academy APP | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ACADEMY APP</span></span></a><span class="appBadge">관장·코치</span></div><div class="roleHero"><div class="kicker">MY ACADEMY</div><h1>내 도장 관리</h1><p class="lead">도장 승인 상태, 소속 선수의 대회 신청과 팀 포인트를 확인하세요.</p></div><div class="kpiGrid" id="acKpis"></div><div class="quickActions"><a class="btn" href="/athlete-app.html">내 선수정보·소속 도장</a><a class="btn gold" href="/competition.html">대회</a><a class="btn" href="/ranking.html">랭킹</a><button class="btn" onclick="SOC.logout()">로그아웃</button></div><div class="grid2"><div class="panel"><div class="num">ACADEMY APPLICATION</div><h3>도장 등록·보완 신청</h3><div class="formGrid"><input type="hidden" id="aId"><div class="field"><label>도장명</label><input id="aName"></div><div class="field"><label>지역</label><input id="aRegion" placeholder="예: 부산"></div><div class="field full"><label>주소</label><input id="aAddress"></div></div><div class="quickActions"><button class="btn gold" onclick="applyAcademy()">가입신청</button></div><p id="applyMsg" class="small"></p></div><div class="panel"><div class="num">MY ACADEMIES</div><h3>내 도장</h3><div id="academyList" class="dataList"></div></div></div><div class="panel" style="margin-top:14px"><div class="num">ATHLETE ROSTER</div><h3>소속 선수</h3><select id="academySelect" class="search"></select><div id="athleteList" class="dataList"></div></div><div class="panel" id="hostTraining" style="margin-top:14px"><div class="num">HOST TRAINING</div><h3>방문훈련 요청</h3><div id="hostTrainingList" class="dataList"></div></div></main><div class="bottomNav"><div class="inner"><a href="/my-soc.html"><b>◎</b>MY SOC</a><a href="/competition.html"><b>◫</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/academies.html"><b>⌂</b>도장</a><a href="/support.html"><b>+</b>지원</a></div></div><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script>
let myAcademies=[],academyBusy=false,academyRevision=0;
const api=(url,opts={})=>SOC.request(url,opts);
async function boot(){const u=await SOC.requireRoles(['COACH','ACADEMY_ADMIN']);if(!u)return;const d=await api('/api/dashboard?role=academy'),labels={academies:'승인된 도장',registeredAthletes:'참가 선수',eventRegistrations:'참가 신청',teamPoints:'팀 포인트'};acKpis.innerHTML=Object.entries(d.data||{}).map(([k,v])=>'<div class="kpi"><strong>'+SOC.escape(v)+'</strong><small>'+SOC.escape(labels[k]||k)+'</small></div>').join('');await loadMine();}
async function applyAcademy(){if(academyBusy)return;academyBusy=true;applyMsg.textContent='도장 신청을 저장하고 있습니다.';try{const d=await api('/api/academies/index',{method:'POST',body:JSON.stringify({id:aId.value||undefined,revision:academyRevision,name:aName.value,region:aRegion.value,address:aAddress.value})});applyMsg.textContent=d.ok?'신청 완료 · 관리자 승인 대기 · 관리자가 도장명과 신청자를 확인한 뒤 승인합니다.':d.message||'신청하지 못했습니다. 입력 내용을 확인해 주세요.';if(d.ok){aId.value='';academyRevision=0;await loadMine();}}finally{academyBusy=false;}}
function editAcademy(id){const a=myAcademies.find(x=>x.id===id);aId.value=a.id;academyRevision=a.revision||0;aName.value=a.name;aRegion.value=a.region;aAddress.value=a.address||'';applyMsg.textContent='내용을 보완한 뒤 가입신청을 누르면 다시 검토합니다.';aName.focus();}
async function loadMine(){const d=await api('/api/academies/mine');if(!d.ok){academyList.textContent=d.message||'도장 목록을 불러오지 못했습니다.';return;}myAcademies=d.academies||[];academyList.replaceChildren();for(const x of myAcademies){const row=document.createElement('div');row.className='dataRow';const info=document.createElement('span');info.textContent=x.name+' · '+x.region+' · '+({PENDING:'승인 대기',APPROVED:'승인 완료',REJECTED:'등록 반려',SUSPENDED:'등록 중지'}[x.status]||x.status)+(x.reviewReason?' · 사유: '+x.reviewReason:'');row.append(info);if(['PENDING','REJECTED'].includes(x.status)){const b=document.createElement('button');b.className='btn';b.textContent='보완·재신청';b.onclick=()=>editAcademy(x.id);row.append(b);}academyList.append(row);}if(!myAcademies.length)academyList.textContent='등록된 도장이 없습니다.';const approved=myAcademies.filter(x=>x.status==='APPROVED');academySelect.replaceChildren();for(const a of approved){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;academySelect.append(o);}academySelect.disabled=!approved.length;if(approved.length)await loadAthletes();else athleteList.textContent='도장 승인이 완료되면 소속 선수를 확인할 수 있습니다.';hostTrainingList.innerHTML='<a class="btn" href="/business.html?kind=training&view=host">훈련 참가자·출석 관리</a>';}
academySelect.addEventListener('change',loadAthletes);
async function loadAthletes(){if(!academySelect.value)return;const d=await api('/api/academies/athletes?academyId='+encodeURIComponent(academySelect.value));athleteList.innerHTML=d.ok?(d.athletes||[]).map(x=>'<div class="dataRow"><span>'+SOC.escape(x.displayName)+' · '+SOC.escape(x.socId)+'</span><b>'+SOC.escape(SOC.beltLabel(x.belt))+'</b></div>').join('')||'<p>연결된 선수가 없습니다.</p>':SOC.escape(d.message||'소속 선수를 불러오지 못했습니다.');}

boot();
</script></body></html>
