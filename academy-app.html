<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Academy APP | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ACADEMY APP</span></span></a><span class="appBadge">관장·코치</span></div><div class="roleHero"><div class="kicker">MY ACADEMY</div><h1>내 도장 관리</h1><p class="lead">도장 가입신청·승인상태·소속 선수·대회신청·팀포인트를 한 화면에서 관리합니다.</p></div><div class="kpiGrid" id="acKpis"></div><div class="quickActions"><a class="btn" href="/athlete-app.html">내 선수정보·소속 도장</a><a class="btn gold" href="/competition.html">대회</a><a class="btn" href="/ranking.html">랭킹</a><button class="btn" onclick="SOC.logout()">로그아웃</button></div><div class="grid2"><div class="panel"><div class="num">ACADEMY APPLICATION</div><h3>도장 가입신청</h3><div class="formGrid"><div class="field"><label>도장명</label><input id="aName"></div><div class="field"><label>지역</label><input id="aRegion" placeholder="예: 부산"></div><div class="field full"><label>주소</label><input id="aAddress"></div></div><div class="quickActions"><button class="btn gold" onclick="applyAcademy()">가입신청</button></div><p id="applyMsg" class="small"></p></div><div class="panel"><div class="num">MY ACADEMIES</div><h3>내 도장</h3><div id="academyList" class="dataList"></div></div></div><div class="panel" style="margin-top:14px"><div class="num">ATHLETE ROSTER</div><h3>소속 선수</h3><select id="academySelect" class="search"></select><div id="athleteList" class="dataList"></div></div><div class="panel" id="hostTraining" style="margin-top:14px"><div class="num">HOST TRAINING</div><h3>방문훈련 요청</h3><div id="hostTrainingList" class="dataList"></div></div></main><div class="bottomNav"><div class="inner"><a href="/my-soc.html"><b>◎</b>MY SOC</a><a href="/competition.html"><b>◫</b>대회</a><a href="/ranking.html"><b>★</b>랭킹</a><a href="/academies.html"><b>⌂</b>도장</a><a href="/support.html"><b>+</b>지원</a></div></div><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script>
let myAcademies=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return await r.json()}
async function boot(){const u=await SOC.requireRoles(['COACH','ACADEMY_ADMIN']);if(!u)return;const d=await api('/api/dashboard?role=academy');const x=d.data||{};acKpis.innerHTML=Object.entries(x).map(([k,v])=>'<div class="kpi"><strong>'+v+'</strong><small>'+k+'</small></div>').join('');await loadMine()}
async function applyAcademy(){const d=await api('/api/academies/index',{method:'POST',body:JSON.stringify({name:aName.value,region:aRegion.value,address:aAddress.value})});applyMsg.textContent=d.ok?'신청 완료 · 관리자 승인 대기':'신청 실패: '+(d.error||'');if(d.ok){applyMsg.textContent+=' · 관리자가 도장명과 신청자를 확인한 뒤 승인합니다.';loadMine()}}
async function loadMine(){const d=await api('/api/academies/mine');myAcademies=d.academies||[];academyList.innerHTML=myAcademies.length?myAcademies.map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.region+'</span><b>'+({PENDING:'승인 대기',APPROVED:'승인 완료',REJECTED:'등록 반려',SUSPENDED:'등록 중지'}[x.status]||x.status)+'</b></div>').join(''):'<div>등록된 도장이 없습니다.</div>';const approved=myAcademies.filter(x=>x.status==='APPROVED');academySelect.innerHTML=approved.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(approved.length){loadAthletes();loadHostTraining()}else athleteList.innerHTML='<div>승인된 도장이 없습니다.</div>'}
academySelect.addEventListener('change',loadAthletes);
async function loadHostTraining(){const d=await api('/api/academy/training-requests');hostTrainingList.innerHTML=(d.requests||[]).length?(d.requests||[]).map(x=>'<div class="dataRow"><span>'+x.athleteName+' · '+x.visitDate+'<br><small>'+x.hostAcademyName+'</small></span><b>'+x.status+'<br><button class="btn" onclick="reviewTraining(\''+x.id+'\',\'APPROVED\')">승인</button> <button class="btn" onclick="reviewTraining(\''+x.id+'\',\'REJECTED\')">거절</button></b></div>').join(''):'<div>요청이 없습니다.</div>'}
async function reviewTraining(id,status){const d=await api('/api/academy/training-requests',{method:'POST',body:JSON.stringify({requestId:id,status})});if(!d.ok)alert(d.error);loadHostTraining()}
async function loadAthletes(){if(!academySelect.value)return;const d=await api('/api/academies/athletes?academyId='+encodeURIComponent(academySelect.value));athleteList.innerHTML=(d.athletes||[]).length?(d.athletes||[]).map(x=>'<div class="dataRow"><span>'+x.displayName+' · '+x.socId+'</span><b>'+x.belt+'</b></div>').join(''):'<div>연결된 선수가 없습니다.</div>'}
boot();
</script></body></html>
