<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교육·활동·평가·수당 | SOC</title><link rel="stylesheet" href="/assets/soc.css"><link rel="icon" href="/favicon.svg"></head><body><main class="appShell"><a href="/my-soc.html" class="btn">내 SOC</a><h1>교육·활동·평가·수당</h1><p>교육·활동 증빙과 계약·평가 기준을 확인한 후 승인합니다. 수당은 실제 은행 지급을 확인한 뒤 기록합니다.</p><button id="reloadRecords" class="btn">새로고침</button><p id="personnelMessage" role="status"></p><form id="personnelCreate" class="panel" hidden><h2>기록 등록</h2><div class="formGrid"><div class="field"><label for="person">대상자</label><select id="person"></select></div><div class="field"><label for="recordType">구분</label><select id="recordType"><option value="EDUCATION">교육 이수</option><option value="ACTIVITY">위원 활동</option><option value="ASSESSMENT">활동·심판 평가</option><option value="ALLOWANCE">수당</option></select></div><div class="field"><label for="recordTitle">교육·활동명</label><input id="recordTitle" required></div><div class="field"><label for="activityDate">교육·활동일</label><input id="activityDate" data-soc-date="date" required></div><div class="field"><label for="plannedAmount">수당 예정액 (원)</label><input id="plannedAmount" type="number" min="0" value="0"></div><div class="field"><label for="assessmentScore">평가점수 (0~100점)</label><input id="assessmentScore" type="number" min="0" max="100" step="0.1"></div><div class="field full"><label for="assessmentBasis">계약·승인 평가 기준·산정 근거</label><textarea id="assessmentBasis" required></textarea></div><div class="field full"><label for="createReason">등록 사유</label><input id="createReason" required></div></div><button class="btn gold">기록 저장</button></form><section id="personnelList" class="dataList"></section><form id="personnelAction" class="panel" hidden><h2 id="actionTitle">기록 처리</h2><label for="personnelSelect">처리 종류</label><select id="personnelSelect"></select><label for="activityEvidence">교육·활동·출석 증빙 관리번호</label><textarea id="activityEvidence"></textarea><label for="actionReason">사유</label><input id="actionReason" required><div id="paymentFields" hidden><label for="actualAmount">실제 지급액 (원)</label><input id="actualAmount" type="number" min="1"><label for="actualAt">실제 은행 거래 일시</label><input id="actualAt" data-soc-date="datetime"><label for="bankReference">은행 거래 증빙 관리번호</label><input id="bankReference"></div><button class="btn gold">처리 저장</button></form></main><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script src="/assets/personnel.js"></script></body></html>
