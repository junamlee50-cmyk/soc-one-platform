<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOC 경기실적증명서</title><link rel="stylesheet" href="/assets/soc.css"><style>@media print{.noPrint{display:none}body{background:#fff;color:#111}.certificate{background:#fff;color:#111;border:2px solid #222}}</style></head><body><main class="appShell"><div class="noPrint appTop"><a class="brand" href="/athlete-app.html"><span class="brandmark">SOC</span></a><span class="appBadge">CERTIFICATE</span></div><div class="noPrint panel"><h3>경기실적증명서 발급</h3><select id="certTournament" class="search"></select><div class="quickActions"><button class="btn gold" onclick="issueCert()">발급</button><button class="btn" onclick="print()">인쇄 / PDF 저장</button></div><p id="msg" class="small"></p></div><div id="certBox"></div></main><script src="/assets/soc.js"></script><script>
async function api(u){const r=await fetch(u,{credentials:'include'});return await r.json()}
async function boot(){const u=await SOC.requireRoles(['ATHLETE']);if(!u)return;const r=await api('/api/registrations/index');const uniq=[...new Map((r.registrations||[]).map(x=>[x.tournamentId,x])).values()];certTournament.innerHTML=uniq.map(x=>'<option value="'+x.tournamentId+'">'+x.tournamentId+'</option>').join('')}
async function issueCert(){const d=await SOC.post('/api/member?op=certificate',{tournamentId:certTournament.value});if(!d.ok){msg.textContent='발급 불가: '+(d.error||'');return}const c=d.certificate;certBox.innerHTML='<section class="certificate card" style="margin-top:20px;padding:38px"><div class="num">STATE OF CONTROL · OFFICIAL RECORD</div><h1 style="font-size:38px">경기실적증명서</h1><div class="dataList"><div class="dataRow"><span>선수</span><b>'+c.athleteName+'</b></div><div class="dataRow"><span>SOC ID</span><b>'+c.socId+'</b></div><div class="dataRow"><span>도장</span><b>'+c.academyName+'</b></div><div class="dataRow"><span>벨트</span><b>'+c.belt+'</b></div><div class="dataRow"><span>대회</span><b>'+c.tournamentName+'</b></div><div class="dataRow"><span>승리</span><b>'+c.wins+'</b></div><div class="dataRow"><span>랭킹포인트</span><b>'+c.points+'</b></div><div class="dataRow"><span>검증코드</span><b>'+c.code+'</b></div></div><div style="display:grid;place-items:center;margin-top:22px"><img src="/api/member?op=certificate-qr&code='+encodeURIComponent(c.code)+'" style="width:200px;background:white;padding:8px"></div></section>'}
boot();
</script></body></html>
