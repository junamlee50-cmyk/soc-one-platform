<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOC 기록 검증</title><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>VERIFY</span></span></a></div><div class="roleHero"><div class="kicker">OFFICIAL RECORD VERIFY</div><h1>SOC 경기실적 검증</h1><p class="lead">검증코드를 입력하거나 증명서 QR로 접속하면 발급 기록의 진위를 확인합니다.</p></div><div class="panel"><input id="code" class="search" placeholder="검증코드"><button class="btn gold" onclick="runVerify()">검증</button><div id="result" style="margin-top:20px"></div></div></main><script src="/assets/soc.js"></script><script>
const q=new URLSearchParams(location.search).get('code');if(q){code.value=q;runVerify()}
async function runVerify(){const r=await fetch('/api/public?op=verify-cert&code='+encodeURIComponent(code.value));const d=await r.json();if(d.valid){const c=d.certificate;result.innerHTML='<div class="notice" style="border-color:#2f7053"><b class="success">유효한 SOC 공식 기록입니다.</b><div class="dataList" style="margin-top:12px"><div class="dataRow"><span>선수</span><b>'+c.athleteName+'</b></div><div class="dataRow"><span>SOC ID</span><b>'+c.socId+'</b></div><div class="dataRow"><span>대회</span><b>'+c.tournamentName+'</b></div><div class="dataRow"><span>승리</span><b>'+c.wins+'</b></div></div></div>'}else result.innerHTML='<div class="notice"><b class="danger">유효한 기록을 찾을 수 없습니다.</b></div>'}
</script></body></html>
