<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기 규정 설정 | SOC ONE</title><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/admin.html"><span class="brandmark">SOC</span></a><a class="btn" href="/admin.html">관리자 화면</a></div><div class="roleHero"><h1>랭킹 규정 검토·승인</h1><p class="lead">아래 값은 검토 중인 기준안입니다. 빈 보정값을 확인하고 정식 공고할 내용을 승인해 주세요. 승인은 대표 권한으로만 가능합니다.</p></div><div class="panel"><p class="notice">3명 부문 보정, 5명 이상 보정, 앱솔루트 메달 점수는 자료 간 확인이 필요합니다. 승인 전에는 이 규정으로 대진을 생성할 수 없습니다. 선수지원 선발 규정과는 별개입니다.</p><div class="formGrid"><div class="field"><label for="version">규정 버전 이름</label><input id="version" maxlength="60"></div><div class="field"><label>시즌 반영 대회</label><input value="최고 성적 6개 대회" disabled></div><div id="fields" class="field full"></div><div class="field full"><label for="reason">승인 근거·변경 사유</label><textarea id="reason" maxlength="500"></textarea></div><div class="field full"><label><input id="ack" type="checkbox" style="width:auto"> 경기점수와 모든 참가인원별 보정값을 확인했으며 이 버전을 승인합니다.</label></div></div><div class="quickActions"><button class="btn" id="draft">검토안 저장</button><button class="btn gold" id="approve">규정 승인</button></div><p id="msg" role="status"></p></div><div class="panel"><h3>저장된 규정</h3><div id="history"></div><p class="small">기존 규정을 덮어쓰지 않고 새 버전으로 저장합니다. 대진 생성 시 적용 규정이 함께 보관됩니다.</p></div></main><script src="/assets/date-input.js"></script><script src="/assets/soc.js"></script><script>
let template;
const labels={participation:'출전 점수 (최대 6회)',win:'실제 경기 승리 점수',GOLD:'금메달',SILVER:'은메달',BRONZE:'동메달',ABS_GOLD:'앱솔루트 금',ABS_SILVER:'앱솔루트 은',ABS_BRONZE:'앱솔루트 동',one:'1명 부문 보정',two:'2명 부문 보정',three:'3명 부문 보정',four:'4명 부문 보정',fiveToEight:'5~8명 부문 보정',ninePlus:'9명 이상 부문 보정'};
async function boot(){const user=await SOC.requireRoles(['ADMIN','CEO']);if(!user)return;const d=await SOC.get('/api/admin/rules');if(!d.ok){msg.textContent=d.message||d.error;return}template=d.template;version.value=template.version;const values={participation:template.participation,win:template.win,...template.medals,...template.bracketFactors};fields.innerHTML='<div class="formGrid">'+Object.entries(values).map(([k,v])=>'<div class="field"><label for="rule-'+k+'">'+labels[k]+'</label><input id="rule-'+k+'" type="number" min="0" step="0.01" value="'+(v??'')+'" placeholder="미확정"></div>').join('')+'</div>';history.innerHTML=(d.rules||[]).map(r=>'<div class="dataRow"><span>'+SOC.escape(r.version)+'<br><small>'+SOC.escape(r.reason)+'</small></span><b>'+({'APPROVED':'승인됨','DRAFT':'검토안'}[r.status]||SOC.escape(r.status))+'</b></div>').join('')||'저장된 규정 없음';approve.disabled=draft.disabled=!user.roles.includes('CEO');}
async function save(status){const val=k=>{const v=document.getElementById('rule-'+k).value;return v===''?null:Number(v)};const body={version:version.value,status,participation:val('participation'),win:val('win'),bestEvents:6,medals:Object.fromEntries(Object.keys(template.medals).map(k=>[k,val(k)])),bracketFactors:Object.fromEntries(Object.keys(template.bracketFactors).map(k=>[k,val(k)])),reason:reason.value,approvalAcknowledged:ack.checked};const d=await SOC.post('/api/admin/rules',body);msg.textContent=d.ok?(status==='APPROVED'?'승인 버전을 저장했습니다. 대회 설정에서 선택해 주세요.':'검토안을 저장했습니다.'):'저장 실패: '+(d.message||d.error);if(d.ok){ack.checked=false;await boot()}}
draft.onclick=()=>save('DRAFT');approve.onclick=()=>save('APPROVED');boot();
</script></body></html>
