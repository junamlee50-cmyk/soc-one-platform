<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOC Admin | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ADMIN</span></span></a><span class="appBadge">OPERATIONS</span></div><div class="roleHero"><div class="kicker">ADMIN CONSOLE</div><h1>실제 운영 관리자 콘솔</h1><p class="lead">회원·아카데미·대회·참가신청·입금·권한·감사로그를 실데이터로 관리합니다.</p></div><div class="kpiGrid" id="overview"></div><div class="tabs"><button class="tab active" data-tab="tournaments">대회</button><button class="tab" data-tab="academies">아카데미</button><button class="tab" data-tab="registrations">참가신청</button><button class="tab" data-tab="users">회원</button><button class="tab" data-tab="audit">감사로그</button></div><section id="tournaments" class="adminTab"><div class="split"><div class="panel"><div class="num">CREATE TOURNAMENT</div><h3>대회 생성</h3><div class="formGrid"><div class="field full"><label>대회명</label><input id="tName"></div><div class="field"><label>등급</label><select id="tLevel"><option>REGIONAL_OPEN</option><option>MAJOR</option><option>NATIONAL</option><option>SEASON_FINAL</option><option>CONTINENTAL</option><option>WORLD</option></select></div><div class="field"><label>랭킹 가중치</label><input id="tMultiplier" value="1"></div><div class="field"><label>장소명</label><input id="tVenue"></div><div class="field"><label>개최일시</label><input id="tStart" type="datetime-local"></div><div class="field"><label>접수시작</label><input id="tOpen" type="datetime-local"></div><div class="field"><label>조기마감</label><input id="tEarly" type="datetime-local"></div><div class="field"><label>일반마감</label><input id="tRegular" type="datetime-local"></div><div class="field"><label>최종마감</label><input id="tClose" type="datetime-local"></div><div class="field"><label>상태</label><select id="tStatus"><option>DRAFT</option><option>COMING_SOON</option><option>REGISTRATION_OPEN</option><option>PUBLISHED</option></select></div><div class="field"><label>조기요금</label><input id="fEarly" type="number" value="49000"></div><div class="field"><label>일반요금</label><input id="fRegular" type="number" value="59000"></div><div class="field"><label>마감요금</label><input id="fLate" type="number" value="69000"></div><div class="field"><label>추가종목</label><input id="fExtra" type="number" value="29000"></div></div><div class="quickActions"><button class="btn gold" onclick="createTournament()">대회 생성</button></div><pre id="tMsg" class="small"></pre></div><div><div class="panel"><div class="num">LIVE TOURNAMENTS</div><h3>등록된 대회</h3><div id="tList" class="dataList"></div></div><div class="panel" style="margin-top:14px"><div class="num">DIVISIONS</div><h3>공식 디비전 생성</h3><div class="formGrid"><div class="field full"><label>대회</label><select id="dTournament"></select></div><div class="field"><label>종목</label><select id="dDiscipline"><option>GI</option><option>NO-GI</option></select></div><div class="field"><label>연령부</label><select id="dAge"><option>KIDS</option><option>YOUTH</option><option>ADULT</option><option>MASTER</option></select></div><div class="field"><label>벨트</label><select id="dBelt"><option>WHITE</option><option>BLUE</option><option>PURPLE</option><option>BROWN</option><option>BLACK</option></select></div><div class="field"><label>성별</label><select id="dGender"><option>MALE</option><option>FEMALE</option></select></div><div class="field"><label>체급명</label><input id="dWeight" placeholder="-76kg"></div><div class="field"><label>상한 kg</label><input id="dLimit" type="number" step="0.1"></div><div class="field"><label><input id="dAbsolute" type="checkbox" style="width:auto"> 앱솔루트</label></div></div><div class="quickActions"><button class="btn gold" onclick="createDivision()">디비전 생성</button></div><p class="small" id="dMsg"></p><div id="dList" class="dataList"></div></div></div></div></section><section id="academies" class="adminTab" style="display:none"><div class="panel"><div class="num">ACADEMY REVIEW</div><h3>아카데미 승인</h3><div id="academyList" class="dataList"></div></div></section><section id="registrations" class="adminTab" style="display:none"><div class="panel"><div class="num">REGISTRATIONS & PAYMENT</div><h3>참가신청·입금상태</h3><div id="registrationList" class="dataList"></div></div></section><section id="users" class="adminTab" style="display:none"><div class="panel"><div class="num">MEMBERS</div><h3>회원·권한</h3><div id="userList" class="dataList"></div></div></section><section id="audit" class="adminTab" style="display:none"><div class="panel"><div class="num">AUDIT LOG</div><h3>주요 변경이력</h3><div id="auditList" class="dataList"></div></div></section></main><script src="/assets/soc.js"></script><script>
let currentUser=null;
async function req(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return await r.json()}
async function boot(){currentUser=await SOC.requireRoles(['STAFF','ADMIN','CEO']);if(!currentUser)return;await Promise.all([loadOverview(),loadTournaments(),loadAcademies(),loadRegistrations(),loadUsers(),loadAudit()])}
document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.adminTab').forEach(x=>x.style.display='none');document.getElementById(b.dataset.tab).style.display='block'});
async function loadOverview(){const d=await req('/api/admin/overview');overview.innerHTML=Object.entries(d.overview||{}).map(([k,v])=>'<div class="kpi"><strong>'+v+'</strong><small>'+k+'</small></div>').join('')}
async function loadTournaments(){const d=await req('/api/admin/tournaments');const rows=d.tournaments||[];tList.innerHTML=rows.map(x=>'<div class="dataRow"><span>'+x.name+'<br><small>'+x.level+' · '+(x.startAt||'')+'</small></span><b>'+x.status+'</b></div>').join('')||'<div>대회 없음</div>'}
async function loadDivisions(){if(!dTournament.value)return;const d=await SOC.get('/api/divisions/index?tournamentId='+encodeURIComponent(dTournament.value));dList.innerHTML=(d.divisions||[]).map(x=>'<div class="dataRow"><span>'+x.discipline+' · '+x.ageGroup+' · '+x.belt+'</span><b>'+x.weightClass+(x.absolute?' · ABS':'')+'</b></div>').join('')||'<div>디비전 없음</div>'}dTournament?.addEventListener('change',loadDivisions);
async function createDivision(){const d=await req('/api/divisions/index',{method:'POST',body:JSON.stringify({tournamentId:dTournament.value,discipline:dDiscipline.value,ageGroup:dAge.value,belt:dBelt.value,gender:dGender.value,weightClass:dWeight.value,weightLimitKg:dLimit.value,absolute:dAbsolute.checked})});dMsg.textContent=d.ok?'생성 완료':'생성 실패: '+(d.error||'');if(d.ok)loadDivisions()}
async function createTournament(){const d=await req('/api/tournaments/index',{method:'POST',body:JSON.stringify({name:tName.value,level:tLevel.value,rankingMultiplier:tMultiplier.value,venueName:tVenue.value,startAt:tStart.value,registrationOpenAt:tOpen.value,earlyUntil:tEarly.value,regularUntil:tRegular.value,registrationCloseAt:tClose.value,status:tStatus.value,earlyFee:fEarly.value,regularFee:fRegular.value,lateFee:fLate.value,extraFee:fExtra.value})});tMsg.textContent=d.ok?'생성 완료':'생성 실패: '+(d.message||d.error);if(d.ok){loadTournaments();loadOverview()}}
async function loadAcademies(){const d=await req('/api/admin/academies');academyList.innerHTML=(d.academies||[]).map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.region+'<br><small>'+x.coachName+' · '+x.status+'</small></span><b><button class="btn" onclick="academyStatus(\''+x.id+'\',\'APPROVED\')">승인</button> <button class="btn" onclick="academyStatus(\''+x.id+'\',\'REJECTED\')">반려</button></b></div>').join('')||'<div>신청 없음</div>'}
async function academyStatus(id,status){const d=await req('/api/admin/academy-status',{method:'POST',body:JSON.stringify({academyId:id,status})});if(!d.ok)alert(d.error);loadAcademies();loadOverview()}
async function loadRegistrations(){const d=await req('/api/admin/registrations');registrationList.innerHTML=(d.registrations||[]).map(x=>'<div class="dataRow"><span>'+x.athleteName+' · '+x.discipline+' '+x.weightClass+'<br><small>'+x.tournamentId+' · '+SOC.money(x.amount||0)+'</small></span><b>'+x.paymentStatus+'<br><button class="btn" onclick="pay(\''+x.id+'\',\'PAID\')">입금확인</button> <button class="btn" onclick="pay(\''+x.id+'\',\'REFUNDED\')">환불완료</button></b></div>').join('')||'<div>참가신청 없음</div>'}
async function pay(id,s){const d=await req('/api/admin/payment-status',{method:'POST',body:JSON.stringify({registrationId:id,paymentStatus:s})});if(!d.ok)alert(d.error);loadRegistrations();loadOverview()}
async function loadUsers(){const d=await req('/api/admin/users');userList.innerHTML=(d.users||[]).map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.socId+'<br><small>'+(x.roles||[]).join(', ')+'</small></span><b>'+x.status+(currentUser.roles.includes('CEO')?'<br><button class="btn" onclick="grant(\''+x.id+'\',\'REFEREE\')">심판부여</button> <button class="btn" onclick="grant(\''+x.id+'\',\'COMMITTEE\')">위원부여</button>':'')+'</b></div>').join('')||'<div>회원 없음</div>'}
async function grant(id,role){const d=await req('/api/admin/role',{method:'POST',body:JSON.stringify({userId:id,role,action:'GRANT'})});if(!d.ok)alert(d.error);loadUsers()}
async function loadAudit(){const d=await req('/api/admin/audit');auditList.innerHTML=(d.audit||[]).slice(0,100).map(x=>'<div class="dataRow"><span>'+x.action+' · '+x.entityType+'<br><small>'+x.entityId+'</small></span><b>'+x.createdAt+'</b></div>').join('')||'<div>감사로그 없음</div>'}
boot();
</script></body></html>
