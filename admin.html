<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOC Admin | SOC ONE</title><meta name="theme-color" content="#06080d"><link rel="icon" href="/favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/soc.css"></head><body><main class="appShell"><div class="appTop"><a class="brand" href="/"><span class="brandmark">SOC</span><span class="brandcopy"><b>STATE OF CONTROL</b><span>ADMIN</span></span></a><span class="appBadge">OPERATIONS</span></div><div class="roleHero"><div class="kicker">ADMIN CONSOLE</div><h1>SOC ONE 통합 운영 관리자</h1><p class="lead">회원·연맹·대회·선수지원·훈련·심판·스폰서·미디어·감사기록을 실데이터로 관리합니다.</p></div><div class="kpiGrid" id="overview"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="tournaments">대회</button><button class="tab" data-tab="academies">아카데미</button><button class="tab" data-tab="registrations">참가·결제</button><button class="tab" data-tab="users">회원</button><button class="tab" data-tab="support">선수지원</button><button class="tab" data-tab="training">훈련</button><button class="tab" data-tab="referees">심판</button><button class="tab" data-tab="sponsors">스폰서</button><button class="tab" data-tab="content">미디어</button><button class="tab" data-tab="audit">감사</button></div>

<section id="tournaments" class="adminTab"><div class="split"><div class="panel"><div class="num">CREATE TOURNAMENT</div><h3>대회 생성</h3><div class="formGrid"><div class="field full"><label>대회명</label><input id="tName"></div><div class="field"><label>등급</label><select id="tLevel"><option>REGIONAL_OPEN</option><option>MAJOR</option><option>NATIONAL</option><option>SEASON_FINAL</option><option>CONTINENTAL</option><option>WORLD</option></select></div><div class="field"><label>가중치</label><input id="tMultiplier" value="1"></div><div class="field"><label>장소</label><input id="tVenue"></div><div class="field"><label>개최일시</label><input id="tStart" type="datetime-local"></div><div class="field"><label>접수시작</label><input id="tOpen" type="datetime-local"></div><div class="field"><label>조기마감</label><input id="tEarly" type="datetime-local"></div><div class="field"><label>일반마감</label><input id="tRegular" type="datetime-local"></div><div class="field"><label>최종마감</label><input id="tClose" type="datetime-local"></div><div class="field"><label>상태</label><select id="tStatus"><option>DRAFT</option><option>COMING_SOON</option><option>REGISTRATION_OPEN</option><option>PUBLISHED</option></select></div><div class="field"><label>조기요금</label><input id="fEarly" type="number" value="49000"></div><div class="field"><label>일반요금</label><input id="fRegular" type="number" value="59000"></div><div class="field"><label>마감요금</label><input id="fLate" type="number" value="69000"></div><div class="field"><label>추가종목</label><input id="fExtra" type="number" value="29000"></div></div><div class="quickActions"><button class="btn gold" onclick="createTournament()">대회 생성</button></div><p id="tMsg" class="small"></p></div><div><div class="panel"><div class="num">TOURNAMENTS</div><h3>등록 대회</h3><div id="tList" class="dataList"></div></div><div class="panel" style="margin-top:14px"><div class="num">DIVISION</div><h3>공식 디비전 생성</h3><div class="formGrid"><div class="field full"><label>대회</label><select id="dTournament"></select></div><div class="field"><label>종목</label><select id="dDiscipline"><option>GI</option><option>NO-GI</option></select></div><div class="field"><label>연령</label><select id="dAge"><option>KIDS</option><option>YOUTH</option><option>ADULT</option><option>MASTER</option></select></div><div class="field"><label>벨트</label><select id="dBelt"><option>WHITE</option><option>BLUE</option><option>PURPLE</option><option>BROWN</option><option>BLACK</option></select></div><div class="field"><label>성별</label><select id="dGender"><option>MALE</option><option>FEMALE</option></select></div><div class="field"><label>체급명</label><input id="dWeight" placeholder="-76kg"></div><div class="field"><label>상한 kg</label><input id="dLimit" type="number" step="0.1"></div><div class="field"><label><input id="dAbsolute" type="checkbox" style="width:auto"> 앱솔루트</label></div></div><div class="quickActions"><button class="btn gold" onclick="createDivision()">디비전 생성</button></div><p id="dMsg" class="small"></p><div id="dList" class="dataList"></div></div></div></div></section>

<section id="academies" class="adminTab" style="display:none"><div class="panel"><h3>아카데미 승인</h3><div id="academyList" class="dataList"></div></div></section>
<section id="registrations" class="adminTab" style="display:none"><div class="panel"><h3>참가신청·결제</h3><div id="registrationList" class="dataList"></div></div></section>
<section id="users" class="adminTab" style="display:none"><div class="panel"><h3>회원·권한</h3><div id="userList" class="dataList"></div></div></section>
<section id="support" class="adminTab" style="display:none"><div class="panel"><h3>선수지원 정량평가</h3><div id="supportList" class="dataList"></div></div></section>
<section id="training" class="adminTab" style="display:none"><div class="panel"><h3>훈련패스·정산</h3><div id="trainingList" class="dataList"></div></div></section>
<section id="referees" class="adminTab" style="display:none"><div class="split"><div class="panel"><h3>심판 배정</h3><div class="formGrid"><div class="field full"><label>심판</label><select id="refUser"></select></div><div class="field full"><label>대회</label><select id="refTournament"></select></div><div class="field"><label>매트</label><input id="refMat" type="number"></div><div class="field"><label>세션</label><input id="refSession" placeholder="오전/오후"></div></div><div class="quickActions"><button class="btn gold" onclick="assignReferee()">배정</button></div></div><div class="panel"><h3>배정현황</h3><div id="refList" class="dataList"></div></div></div></section>
<section id="sponsors" class="adminTab" style="display:none"><div class="split"><div class="panel"><h3>스폰서 등록</h3><div class="formGrid"><div class="field full"><label>스폰서명</label><input id="spName"></div><div class="field"><label>구분</label><input id="spCategory" placeholder="TITLE/OFFICIAL/ATHLETE"></div><div class="field"><label>상태</label><select id="spStatus"><option>LEAD</option><option>NEGOTIATING</option><option>CONTRACTED</option><option>CLOSED</option></select></div><div class="field"><label>계약금액</label><input id="spValue" type="number"></div><div class="field"><label>미수금</label><input id="spRecv" type="number"></div></div><div class="quickActions"><button class="btn gold" onclick="saveSponsor()">저장</button></div></div><div class="panel"><h3>스폰서 CRM</h3><div id="sponsorList" class="dataList"></div></div></div></section>
<section id="content" class="adminTab" style="display:none"><div class="split"><div class="panel"><h3>콘텐츠 등록</h3><div class="formGrid"><div class="field"><label>유형</label><select id="cType"><option>NEWS</option><option>VIDEO</option><option>INTERVIEW</option><option>ACADEMY</option></select></div><div class="field"><label>상태</label><select id="cStatus"><option>DRAFT</option><option>PUBLISHED</option></select></div><div class="field full"><label>제목</label><input id="cTitle"></div><div class="field full"><label>요약</label><textarea id="cSummary"></textarea></div><div class="field full"><label>커버 URL</label><input id="cCover"></div></div><div class="quickActions"><button class="btn gold" onclick="saveContent()">저장</button></div></div><div class="panel"><h3>콘텐츠 목록</h3><div id="contentList" class="dataList"></div></div></div></section>
<section id="audit" class="adminTab" style="display:none"><div class="panel"><h3>감사로그</h3><div id="auditList" class="dataList"></div></div></section>
</main><script src="/assets/soc.js"></script><script>
let currentUser=null,allUsers=[],allTournaments=[];
async function req(url,opts={}){const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});return await r.json()}
document.querySelectorAll('.tab[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.adminTab').forEach(x=>x.style.display='none');document.getElementById(b.dataset.tab).style.display='block'});
async function boot(){currentUser=await SOC.requireRoles(['STAFF','ADMIN','CEO']);if(!currentUser)return;await Promise.all([loadOverview(),loadTournaments(),loadAcademies(),loadRegistrations(),loadUsers(),loadSupport(),loadTraining(),loadRefs(),loadSponsors(),loadContent(),loadAudit()])}
async function loadOverview(){const d=await req('/api/admin/overview');overview.innerHTML=Object.entries(d.overview||{}).map(([k,v])=>'<div class="kpi"><strong>'+v+'</strong><small>'+k+'</small></div>').join('')}
async function loadTournaments(){const d=await req('/api/admin/tournaments');allTournaments=d.tournaments||[];tList.innerHTML=allTournaments.map(x=>'<div class="dataRow"><span>'+x.name+'<br><small>'+x.level+' · '+(x.startAt||'')+'</small></span><b>'+x.status+'</b></div>').join('')||'<div>대회 없음</div>';dTournament.innerHTML=allTournaments.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');refTournament.innerHTML=dTournament.innerHTML;if(allTournaments.length)loadDivisions()}
async function createTournament(){const d=await req('/api/tournaments/index',{method:'POST',body:JSON.stringify({name:tName.value,level:tLevel.value,rankingMultiplier:tMultiplier.value,venueName:tVenue.value,startAt:tStart.value,registrationOpenAt:tOpen.value,earlyUntil:tEarly.value,regularUntil:tRegular.value,registrationCloseAt:tClose.value,status:tStatus.value,earlyFee:fEarly.value,regularFee:fRegular.value,lateFee:fLate.value,extraFee:fExtra.value})});tMsg.textContent=d.ok?'생성 완료':'실패: '+(d.error||'');if(d.ok){loadTournaments();loadOverview()}}
async function loadDivisions(){if(!dTournament.value)return;const d=await SOC.get('/api/divisions/index?tournamentId='+encodeURIComponent(dTournament.value));dList.innerHTML=(d.divisions||[]).map(x=>'<div class="dataRow"><span>'+x.discipline+' · '+x.ageGroup+' · '+x.belt+'</span><b>'+x.weightClass+(x.absolute?' ABS':'')+'</b></div>').join('')||'<div>디비전 없음</div>'}dTournament.addEventListener('change',loadDivisions);
async function createDivision(){const d=await req('/api/divisions/index',{method:'POST',body:JSON.stringify({tournamentId:dTournament.value,discipline:dDiscipline.value,ageGroup:dAge.value,belt:dBelt.value,gender:dGender.value,weightClass:dWeight.value,weightLimitKg:dLimit.value,absolute:dAbsolute.checked})});dMsg.textContent=d.ok?'생성 완료':'실패: '+(d.error||'');if(d.ok)loadDivisions()}
async function loadAcademies(){const d=await req('/api/admin/academies');academyList.innerHTML=(d.academies||[]).map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.region+'<br><small>'+x.coachName+' · '+x.status+'</small></span><b><button class="btn" onclick="academyStatus(\''+x.id+'\',\'APPROVED\')">승인</button> <button class="btn" onclick="academyStatus(\''+x.id+'\',\'REJECTED\')">반려</button></b></div>').join('')||'<div>신청 없음</div>'}
async function academyStatus(id,status){const d=await req('/api/admin/academy-status',{method:'POST',body:JSON.stringify({academyId:id,status})});if(!d.ok)alert(d.error);loadAcademies();loadOverview()}
async function loadRegistrations(){const d=await req('/api/admin/registrations');registrationList.innerHTML=(d.registrations||[]).map(x=>'<div class="dataRow"><span>'+x.athleteName+' · '+x.discipline+' '+x.weightClass+'<br><small>'+x.tournamentId+' · '+SOC.money(x.amount||0)+'</small></span><b>'+x.paymentStatus+'<br><button class="btn" onclick="pay(\''+x.id+'\',\'PAID\')">입금확인</button> <button class="btn" onclick="pay(\''+x.id+'\',\'REFUNDED\')">환불</button></b></div>').join('')||'<div>신청 없음</div>'}
async function pay(id,s){const d=await req('/api/admin/payment-status',{method:'POST',body:JSON.stringify({registrationId:id,paymentStatus:s})});if(!d.ok)alert(d.error);loadRegistrations();loadOverview()}
async function loadUsers(){const d=await req('/api/admin/users');allUsers=d.users||[];userList.innerHTML=allUsers.map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.socId+'<br><small>'+(x.roles||[]).join(', ')+'</small></span><b>'+x.status+(currentUser.roles.includes('CEO')?'<br><button class="btn" onclick="grant(\''+x.id+'\',\'REFEREE\')">심판</button> <button class="btn" onclick="grantCommittee(\''+x.id+'\')">위원</button> <button class="btn" onclick="grant(\''+x.id+'\',\'STAFF\')">직원</button>':'')+'</b></div>').join('')||'<div>회원 없음</div>';refUser.innerHTML=allUsers.filter(x=>(x.roles||[]).includes('REFEREE')).map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.socId+'</option>').join('')}
async function grant(id,role){const d=await req('/api/admin/role',{method:'POST',body:JSON.stringify({userId:id,role,action:'GRANT'})});if(!d.ok)alert(d.error);loadUsers()}
async function grantCommittee(id){const region=prompt('담당 지역명을 정확히 입력하세요. 예: 부산·울산·경남');if(!region)return;const d=await req('/api/admin/role',{method:'POST',body:JSON.stringify({userId:id,role:'COMMITTEE',action:'GRANT',region})});if(!d.ok)alert(d.error);loadUsers()}
async function loadSupport(){const d=await req('/api/admin/support');supportList.innerHTML=(d.applications||[]).map(x=>'<div class="dataRow"><span>'+x.socId+' · '+x.season+' '+x.tier+'<br><small>'+x.status+(x.score!=null?' · '+x.score+'점':'')+'</small></span><b><button class="btn" onclick="scoreSupport(\''+x.id+'\')">평가</button></b></div>').join('')||'<div>신청 없음</div>'}
async function scoreSupport(id){const competition=Number(prompt('SOC 경기성과 /45','0'));const external=Number(prompt('외부·국제 /20','0'));const growth=Number(prompt('성장 /10','0'));const activity=Number(prompt('활동 /10','0'));const compliance=Number(prompt('규정준수 /10','0'));const media=Number(prompt('미디어 /5','0'));const selected=confirm('선발 처리하시겠습니까?');const d=await req('/api/admin/support',{method:'POST',body:JSON.stringify({applicationId:id,competition,external,growth,activity,compliance,media,selected,status:selected?'SELECTED':'SCORED'})});if(!d.ok)alert(d.error);loadSupport()}
async function loadTraining(){const d=await req('/api/admin/training');trainingList.innerHTML=(d.requests||[]).map(x=>'<div class="dataRow"><span>'+x.athleteName+' → '+x.hostAcademyName+'<br><small>'+x.visitDate+' · '+x.status+'</small></span><b>'+SOC.money(x.settlementAmount||0)+'<br><button class="btn" onclick="settleTraining(\''+x.id+'\')">정산</button></b></div>').join('')||'<div>요청 없음</div>'}
async function settleTraining(id){const amount=Number(prompt('호스트 정산금액','0'));if(!Number.isFinite(amount))return;const d=await req('/api/admin/training-settlement',{method:'POST',body:JSON.stringify({requestId:id,amount,currency:'KRW',status:'PAID'})});if(!d.ok)alert(d.error);loadTraining()}
async function loadRefs(){const d=await req('/api/admin/referee-assignments');refList.innerHTML=(d.assignments||[]).map(x=>'<div class="dataRow"><span>'+x.tournamentId+' · MAT '+(x.matNo||'-')+'</span><b>'+x.session+' · '+x.status+'</b></div>').join('')||'<div>배정 없음</div>'}
async function assignReferee(){const d=await req('/api/admin/referee-assignment',{method:'POST',body:JSON.stringify({refereeUserId:refUser.value,tournamentId:refTournament.value,matNo:refMat.value,session:refSession.value})});if(!d.ok)alert(d.error);loadRefs()}
async function loadSponsors(){const d=await req('/api/admin/sponsors');sponsorList.innerHTML=(d.sponsors||[]).map(x=>'<div class="dataRow"><span>'+x.name+' · '+x.category+'</span><b>'+x.status+' · '+SOC.money(x.contractValue||0)+'</b></div>').join('')||'<div>등록 없음</div>'}
async function saveSponsor(){const d=await req('/api/admin/sponsors',{method:'POST',body:JSON.stringify({name:spName.value,category:spCategory.value,status:spStatus.value,contractValue:spValue.value,receivable:spRecv.value,currency:'KRW'})});if(!d.ok)alert(d.error);loadSponsors()}
async function loadContent(){const d=await req('/api/admin/content');contentList.innerHTML=(d.content||[]).map(x=>'<div class="dataRow"><span>'+x.title+'<br><small>'+x.type+'</small></span><b>'+x.status+'</b></div>').join('')||'<div>콘텐츠 없음</div>'}
async function saveContent(){const d=await req('/api/admin/content',{method:'POST',body:JSON.stringify({type:cType.value,status:cStatus.value,title:cTitle.value,summary:cSummary.value,coverUrl:cCover.value})});if(!d.ok)alert(d.error);loadContent()}
async function loadAudit(){const d=await req('/api/admin/audit');auditList.innerHTML=(d.audit||[]).slice(0,200).map(x=>'<div class="dataRow"><span>'+x.action+' · '+x.entityType+'<br><small>'+x.entityId+'</small></span><b>'+x.createdAt+'</b></div>').join('')||'<div>로그 없음</div>'}
boot();
</script></body></html>
